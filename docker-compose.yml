services:
  algotrader:
    build: .
    container_name: algotrader
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - TRADIER_API_KEY=${TRADIER_API_KEY}
      - LIVE_PARAMS_PATH=${LIVE_PARAMS_PATH:-config/trial_124_microcap_pump_extracted.json}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
