name: Dynamic gainers 2026 recovery

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Optional prior workflow run ID whose checkpoints should be restored
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dynamic-gainers-data
  cancel-in-progress: false

env:
  YEAR: "2026"
  OUT: ${{ github.workspace }}/dynamic-gainers-output/2026_fast
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}

jobs:
  references_and_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p "$OUT"
      - name: Restore prior daily reference checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-daily
          path: ${{ env.OUT }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore prior candidate checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-candidates
          path: ${{ env.OUT }}/stage2_candidates
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Build daily references
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year "$YEAR" --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --stop-after daily
      - name: Save daily reference checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gainers-2026-daily
          path: |
            ${{ env.OUT }}/asset_master.json
            ${{ env.OUT }}/calendar.json
            ${{ env.OUT }}/stage1_daily_reference/
          if-no-files-found: warn
          retention-days: 30
      - name: Build candidate days
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year "$YEAR" --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --stop-after candidates
      - name: Save candidate checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gainers-2026-candidates
          path: ${{ env.OUT }}/stage2_candidates/
          if-no-files-found: warn
          retention-days: 30

  membership:
    needs: references_and_candidates
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p "$OUT"
      - name: Restore daily references from this run
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-daily
          path: ${{ env.OUT }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore candidate days from this run
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-candidates
          path: ${{ env.OUT }}/stage2_candidates
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore prior membership checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-membership
          path: ${{ env.OUT }}/stage3_membership
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Build membership and entrants
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year "$YEAR" --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --stop-after membership
      - name: Save membership checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gainers-2026-membership
          path: ${{ env.OUT }}/stage3_membership/
          if-no-files-found: warn
          retention-days: 30

  lifecycle:
    needs: membership
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p "$OUT"
      - name: Restore daily references from this run
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-daily
          path: ${{ env.OUT }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore candidate days from this run
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-candidates
          path: ${{ env.OUT }}/stage2_candidates
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore membership and entrants from this run
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2026-membership
          path: ${{ env.OUT }}/stage3_membership
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Restore prior lifecycle checkpoints
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: dynamic-gainers-2026-lifecycle-*
          merge-multiple: true
          path: ${{ env.OUT }}/stage4_lifecycle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Build and save lifecycle month 01
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year "$YEAR" --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --lifecycle-month 1 --stop-after lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-gainers-2026-lifecycle-01
          path: |
            ${{ env.OUT }}/stage4_lifecycle/lifecycle_2026_01.csv.gz
            ${{ env.OUT }}/stage4_lifecycle/days/2026-01-??.csv.gz
          if-no-files-found: warn
          retention-days: 30
      - name: Build and save lifecycle month 02
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year "$YEAR" --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --lifecycle-month 2 --stop-after lifecycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-gainers-2026-lifecycle-02
          path: |
            ${{ env.OUT }}/stage4_lifecycle/lifecycle_2026_02.csv.gz
            ${{ env.OUT }}/stage4_lifecycle/days/2026-02-??.csv.gz
