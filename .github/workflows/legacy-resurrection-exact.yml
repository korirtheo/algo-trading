name: Legacy resurrection exact first batch

on:
  push:
    branches:
      - research/legacy-long-resurrection-20261004
    paths:
      - 'legacy_resurrection_exact/**'
      - '.github/workflows/legacy-resurrection-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-first-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy pandas pytest matplotlib optuna
      - name: Causality tests
        run: pytest -q tests/test_legacy_long_causality.py
      - name: Exact first batch
        run: python -m legacy_resurrection_exact.run_first_batch_exact
      - name: Upload exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-resurrection-exact-first-batch-20261004
          path: results/legacy_resurrection_exact_20261004/
          if-no-files-found: warn
