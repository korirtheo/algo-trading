name: Dynamic gainers 2025 recovery

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Optional prior workflow run ID whose checkpoints should be restored
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: dynamic-gainers-2025
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      OUT: /tmp/dynamic-gainers/2025_fast
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create output directory
        run: mkdir -p "$OUT"
      - name: Restore candidate checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2025-candidates
          path: ${{ runner.temp }}/dynamic-gainers/2025_fast
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore membership checkpoint
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2025-membership
          path: ${{ runner.temp }}/dynamic-gainers/2025_fast/stage3_membership
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore lifecycle checkpoints
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: dynamic-gainers-2025-lifecycle-*
          merge-multiple: true
          path: ${{ runner.temp }}/dynamic-gainers/2025_fast/stage4_lifecycle
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Restore validation and manifest
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dynamic-gainers-2025-report
          path: ${{ runner.temp }}/dynamic-gainers/2025_fast
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Build daily references and candidate days
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year 2025 --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --stop-after candidates
      - name: Save candidate checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gainers-2025-candidates
          path: |
            ${{ runner.temp }}/dynamic-gainers/2025_fast/asset_master.json
            ${{ runner.temp }}/dynamic-gainers/2025_fast/calendar.json
            ${{ runner.temp }}/dynamic-gainers/2025_fast/stage1_daily_reference/
            ${{ runner.temp }}/dynamic-gainers/2025_fast/stage2_candidates/
          if-no-files-found: warn
          retention-days: 30
      - name: Build membership and entrants
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year 2025 --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --stop-after membership
      - name: Save membership checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gainers-2025-membership
          path: ${{ runner.temp }}/dynamic-gainers/2025_fast/stage3_membership/
          if-no-files-found: warn
          retention-days: 30
      - name: Build lifecycle month 01
        run: python scripts/recovery/alpaca_dynamic_gainers.py --year 2025 --output "$OUT" --top-n 30 --workers 8 --symbol-batch 180 --rpm 180 --lifecycle-month 1
      - name: Save lifecycle month 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-gainers-2025-lifecycle-01
          path: |
            ${{ runner.temp }}/dynamic-gainers/2025_fast/stage4_lifecycle/lifecycle_2025_01.csv.gz
            ${{ runner.temp }}/dynamic-gainers/2025_fast/stage4_lifecycle/days/2025-01-??.csv.gz
