name: Legacy long resurrection baseline

on:
  push:
    branches:
      - research/legacy-long-resurrection-20261004
    paths:
      - 'research/legacy_long_resurrection/**'
      - 'tests/test_legacy_long_causality.py'
      - '.github/workflows/legacy-long-resurrection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy pandas pytest matplotlib optuna
      - name: Causality tests
        run: pytest -q tests/test_legacy_long_causality.py
      - name: Clean unoptimized baseline
        run: python -m research.legacy_long_resurrection.run_baseline
      - name: Standalone viability baseline
        run: python -m research.legacy_long_resurrection.run_standalone
      - name: Causal first-batch search
        run: python -m research.legacy_long_resurrection.optimize_first_batch
      - name: High-payoff VWAP runner research
        run: python -m research.legacy_long_resurrection.research_vwap_runner
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-long-resurrection-baseline-20261004
          path: results/legacy_long_resurrection_baseline_20261004/
          if-no-files-found: warn
