name: Legacy long resurrection baseline

on:
  push:
    branches:
      - research/legacy-long-resurrection-20261004
    paths:
      - 'research/legacy_long_resurrection/**'
      - 'tests/test_legacy_long_causality.py'
      - '.github/workflows/legacy-long-resurrection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore loader cache
        uses: actions/cache@v4
        with:
          path: stored_data_combined/fulltest_picks_gap5_vol250k.pkl
          key: legacy-long-gap5-vol250k-v1
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy pandas pytest matplotlib optuna scikit-learn
      - name: Causality tests
        run: pytest -q tests/test_legacy_long_causality.py
      - name: G and R deep economic-state research
        run: python -m research.legacy_long_resurrection.research_gr_economic_state
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-long-resurrection-baseline-20261004
          path: results/gr_economic_state_engine_20261005/
          if-no-files-found: warn
